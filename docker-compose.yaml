services:
  tg-btc-bot:
    container_name: tg-btc-bot
    restart: unless-stopped
    mem_limit: 512m
    cpus: 0.5
    image: ghcr.io/pavelkv94/tg-btc-assistant_bot:latest
    environment:
      TG_BOT_TOKEN: $TG_BOT_TOKEN
      COINMARKET_API_KEY: $COINMARKET_API_KEY
      MONGO_URL: $MONGO_URL
      DB_NAME: $DB_NAME
      WEB_APP_URL: $WEB_APP_URL
      PORT: $PORT
    ports: 
      - "5004:5000"
